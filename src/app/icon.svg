<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4269B" />
      <stop offset="100%" stop-color="#D81081" />
    </linearGradient>
  </defs>
  <!-- Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#magentaGrad)" />
  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" />
  <!-- "FR" Monogram -->
  <text
    x="32"
    y="33.5"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="31"
    font-weight="900"
    fill="#FFFFFF"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-1.5"
  >FR</text>
</svg>
